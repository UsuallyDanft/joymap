[project]
name = "joymap"
version = "0.1.0"
description = "Mapeador de mando a teclado para Linux, inspirado en JoyToKey"
requires-python = ">=3.10"
dependencies = [
    "evdev>=1.6",
]

[project.optional-dependencies]
gui = ["PyGObject>=3.42"]

[project.scripts]
joymap = "joymap.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
